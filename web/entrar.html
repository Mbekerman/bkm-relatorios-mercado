<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Relatórios de mercado BKM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script>try{const t=localStorage.getItem('bkm-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="entrar">
  <div class="card">
    <img class="logo" src="/marca/bkm-logo.svg" alt="BKM">
    <h1>Relatórios de mercado</h1>
    <p class="suave" style="margin:0">Entre com a sua conta Google da BKM (@bkm.com.br).</p>
    <div class="erro" id="erro" role="alert" hidden></div>
    <a class="btn google" id="entrar" href="/auth/entrar">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
        <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
      </svg>
      Entrar com o Google
    </a>
  </div>
</div>
<script>
const q=new URLSearchParams(location.search);const e=q.get('erro');
const msg={dominio:'Só entra quem tem conta Google da BKM (@bkm.com.br).',login:'O Google não completou o login. Tente de novo.'};
if(e&&msg[e]){const d=document.getElementById('erro');d.textContent=msg[e];d.hidden=false;history.replaceState(null,'',location.pathname)}
const aqui=(location.pathname==='/entrar'?'/':location.pathname)+location.hash;
const v=q.get('voltar')||(aqui!=='/'?aqui:'');
if(v&&v.startsWith('/')&&!v.startsWith('//'))document.getElementById('entrar').href='/auth/entrar?voltar='+encodeURIComponent(v);
</script>
</body>
</html>
