<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatórios de mercado BKM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script>try{const t=localStorage.getItem('bkm-tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="topo">
  <a href="#/novo" aria-label="Início"><img class="logo" src="/marca/bkm-logo.svg" alt="BKM"></a>
  <span class="produto">Relatórios de mercado</span>
  <span class="selo-dev" id="selo-dev" hidden>Desenvolvimento</span>
  <span class="esp"></span>
  <div class="menu">
    <button class="icbtn" id="btn-tema" aria-haspopup="menu" aria-expanded="false" title="Tema">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 16V5a7 7 0 0 1 0 14Z"/></svg>
    </button>
    <div class="menu-pop" id="menu-tema" role="menu" hidden>
      <button role="menuitemradio" data-tema="light">Claro</button>
      <button role="menuitemradio" data-tema="dark">Escuro</button>
      <button role="menuitemradio" data-tema="auto">Automático</button>
    </div>
  </div>
  <div class="menu">
    <button class="icbtn" id="btn-conta" aria-haspopup="menu" aria-expanded="false" title="Conta"><span class="avatar" id="avatar"></span></button>
    <div class="menu-pop" id="menu-conta" role="menu" hidden>
      <div class="info"><b id="eu-nome"></b><span class="suave" id="eu-email"></span></div>
      <hr>
      <button role="menuitem" id="sair">Sair</button>
    </div>
  </div>
</div>

<div class="moldura">
  <nav class="gaveta" aria-label="Navegação">
    <a class="criar" href="#/novo" id="nav-criar">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      Novo relatório
    </a>
    <a class="nav" href="#/relatorios" id="nav-relatorios">
      <svg class="ico" viewBox="0 0 96 96" aria-hidden="true" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="20" y="12" width="56" height="72" rx="8" stroke="currentColor"/><path d="M32 32h32M32 46h32M32 60h20" stroke="#0094fe"/></svg>
      Relatórios
    </a>
  </nav>
  <main id="tela" tabindex="-1"></main>
</div>

<datalist id="lista-estacoes"></datalist>
<script type="module" src="/app.js"></script>
</body>
</html>
